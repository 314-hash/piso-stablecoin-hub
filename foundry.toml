[profile.default]
src = "contracts"
out = "out"
libs = ["contracts/lib", "node_modules"]
test = "tests"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
piso = "https://rpc.pisochain.com"

[etherscan]
piso = { key = "not-required", url = "https://pisochain.com/api" }

